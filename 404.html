<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found — Robby Aliasa Akbar</title>
  <meta name="description" content="Oops — the page you're looking for doesn't exist. Let's get you back to exploring AI systems, local LLMs, and practical automation experiments.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="author" content="Robby Aliasa Akbar">
  <meta name="theme-color" content="#0C0C0C">
  <link rel="icon" type="image/webp" href="/images/logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Manrope', system-ui, sans-serif;
      background: #FFFFFF;
      color: #0C0C0C;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .wrap { text-align: center; max-width: 28rem; }
    .code {
      font-size: 6rem;
      font-weight: 800;
      line-height: 1;
      color: #D70000;
      letter-spacing: -0.04em;
    }
    h1 { font-size: 1.5rem; font-weight: 700; margin-top: 1rem; }
    p { color: #555; margin-top: 0.75rem; line-height: 1.6; }
    .links { margin-top: 2rem; display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.7rem 1.4rem; border-radius: 9999px;
      font-size: 0.9rem; font-weight: 600; text-decoration: none;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.8; }
    .btn-primary { background: #0C0C0C; color: #fff; }
    .btn-outline { background: transparent; color: #0C0C0C; border: 1.5px solid #0C0C0C; }
    .arrow { font-size: 1rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
    <div class="links">
      <a href="/" class="btn btn-primary">Back to Home <span class="arrow">→</span></a>
      <a href="/experiments-list.html" class="btn btn-outline">Browse Experiments</a>
    </div>
  </div>
</body>
</html>
