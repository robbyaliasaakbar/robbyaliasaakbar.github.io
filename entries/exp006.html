            "text": "No. For under ~10k customers, a single customers.js file on Hostinger file storage (100GB) is enough. It&apos;s downloadable via File Manager, no phpMyAdmin. save.php (44 lines) handles POST {'{type, content}'} with allowlist. localStorage is fallback if fetch fails."
