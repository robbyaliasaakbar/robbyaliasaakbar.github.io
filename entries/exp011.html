          "@type": "Question",
          "name": "Why PHP + SQLite + Docker instead of Node + Postgres?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Locked for this scale: PHP built-ins already cover hash + random + PDO, SQLite is 1 file with zero server, Docker gives PHP without native install. Postgres + JWT + mailer libs are noted as production upgrades, not v1."
          }
        },
        {
          "@type": "Question",
          "name": "How can :7001 talk to :7002 without being blocked?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Explicit CORS allowlist plus same-host pass for Tailscale. Preflight OPTIONS returns 204 with Allow-Origin only for listed hosts. Next app (:7003) just gets added to the list."
          }
        },
